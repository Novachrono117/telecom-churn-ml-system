[project]
name = "churn-ml-engineering"
version = "0.1.0"
description = "End-to-end machine learning engineering solution for telecom customer churn prediction."
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Vinicius Gomes", email = "vinicius08gomes@gmail.com" }]
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "joblib>=1.4",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
# Required from Phase 3 on to author and execute notebooks/01_eda.ipynb.
# nbconvert is what validates the notebook runs end to end; nbformat is imported
# directly by the validation step. Kept out of the runtime dependencies.
notebooks = [
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
