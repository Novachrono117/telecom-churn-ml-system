<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1020" width="1240" height="1020"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="title desc">
  <title id="title">Churn inference architecture</title>
  <desc id="desc">Two request surfaces reach one FastAPI process: API consumers post to the
    prediction endpoints, and the Portfolio UI sends exactly one explanation request per
    submission. Both go through the same canonical scoring call, so a submission scores once and is
    observed once. The request passes the feature contract, then the frozen preprocessing and
    logistic regression pipeline, which emits a churn probability. That probability feeds two
    branches: the frozen decision policy that compares it against the threshold
    0.3272694566222328, and the exact log-odds decomposition. The monitoring observer sits off the
    causal path, only observes, and its endpoint is a read-only poll that scores nothing.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-observe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1020" fill="#ffffff"/>

  <!-- ================================================================ zone 3 -->
  <rect x="24" y="24" width="1192" height="972" rx="14" fill="#ffffff" stroke="#94a3b8"
        stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="48" y="58" font-size="15" font-weight="700" fill="#0f172a">
    3 · SERVING, OBSERVABILITY AND DEMO — one FastAPI process
  </text>
  <text x="48" y="80" font-size="12" fill="#475569">
    34 startup integrity gates: artifact digest · model fingerprint · decision-policy digest ·
    pinned scikit-learn, numpy, pandas and joblib.
  </text>
  <text x="48" y="98" font-size="12" fill="#475569">
    On any mismatch the process refuses to serve — it fails closed rather than serving an
    unverified model.
  </text>

  <!-- === request surfaces -->
  <text x="64" y="204" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.6">
    REQUEST SURFACES
  </text>

  <rect x="64" y="214" width="224" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="236" font-size="13" font-weight="600" fill="#0f172a">API consumers</text>
  <text x="80" y="254" font-size="10.5" fill="#475569" font-family="ui-monospace, Consolas, monospace">
    POST /api/v1/predict
  </text>
  <text x="80" y="269" font-size="10.5" fill="#475569" font-family="ui-monospace, Consolas, monospace">
    POST /api/v1/predict/batch
  </text>
  <text x="80" y="284" font-size="10.5" fill="#64748b">one record = one observation</text>

  <rect x="64" y="306" width="224" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="328" font-size="13" font-weight="600" fill="#0f172a">Portfolio UI</text>
  <text x="80" y="346" font-size="10.5" fill="#475569" font-family="ui-monospace, Consolas, monospace">
    GET /demo
  </text>
  <text x="80" y="361" font-size="11" fill="#475569">Churn Risk Console · off by default</text>
  <text x="80" y="383" font-size="10.5" fill="#334155">one submission sends exactly one:</text>
  <text x="80" y="399" font-size="10.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">
    POST /api/v1/explain
  </text>

  <path d="M288 252 H310" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M288 358 H310" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M176 410 V430" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"
        marker-end="url(#arrow-observe)"/>

  <rect x="64" y="434" width="224" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8"
        stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="456" font-size="12" font-weight="600" fill="#0f172a">and one read-only poll</text>
  <text x="80" y="474" font-size="10.5" fill="#475569" font-family="ui-monospace, Consolas, monospace">
    GET /api/v1/monitoring
  </text>
  <text x="80" y="490" font-size="10.5" fill="#475569">reads the observer's aggregates</text>
  <text x="80" y="506" font-size="10.5" fill="#64748b">no scoring · no observation</text>

  <rect x="64" y="548" width="224" height="124" rx="8" fill="#f8fafc" stroke="#64748b"
        stroke-width="1.5"/>
  <text x="80" y="572" font-size="12.5" font-weight="700" fill="#0f172a">
    One canonical scoring path
  </text>
  <text x="80" y="594" font-size="11" fill="#475569">Both surfaces call the same</text>
  <text x="80" y="609" font-size="10.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">
    score_with_features()
  </text>
  <text x="80" y="628" font-size="11" fill="#475569">so /explain returns the same</text>
  <text x="80" y="643" font-size="11" fill="#475569">probability /predict would, and</text>
  <text x="80" y="658" font-size="11" fill="#475569">is observed the same way.</text>

  <!-- ================================================================ zone 1 -->
  <rect x="316" y="124" width="624" height="252" rx="10" fill="#f8fafc" stroke="#64748b"
        stroke-width="1.5"/>
  <text x="340" y="150" font-size="12.5" font-weight="700" fill="#334155">
    1 · DATA AND FEATURE CONTRACT — runs BEFORE the persisted pipeline
  </text>

  <rect x="340" y="166" width="576" height="52" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="356" y="188" font-size="13" font-weight="600" fill="#0f172a">Public Telco dataset</text>
  <text x="356" y="206" font-size="11" fill="#475569">
    7,043 rows · raw SHA-256 pinned · the file itself is never modified
  </text>

  <path d="M628 218 V232" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="340" y="236" width="576" height="52" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="356" y="258" font-size="13" font-weight="600" fill="#0f172a">Raw record</text>
  <text x="356" y="276" font-size="11" fill="#475569">
    the 19 contracted fields — customerID and Churn can never become features
  </text>

  <path d="M628 288 V302" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="340" y="306" width="576" height="58" rx="7" fill="#ffffff" stroke="#334155"
        stroke-width="1.5"/>
  <text x="356" y="328" font-size="13" font-weight="600" fill="#0f172a"
        font-family="ui-monospace, Consolas, monospace">prepare_features()</text>
  <text x="356" y="346" font-size="11" fill="#475569">
    validates types and domains · orders columns canonically · imputes nothing
  </text>
  <text x="356" y="360" font-size="10.5" fill="#64748b">
    outside both model fingerprints, so its source file is hashed separately
  </text>

  <path d="M628 376 V400" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================================================================ zone 2 -->
  <rect x="316" y="404" width="624" height="380" rx="10" fill="#f1f5f9" stroke="#334155"
        stroke-width="2.2"/>
  <text x="340" y="430" font-size="12.5" font-weight="700" fill="#0f172a">
    2 · FROZEN ML ARTIFACT AND DECISION POLICY — closed, fingerprinted, regenerable
  </text>

  <rect x="340" y="446" width="576" height="66" rx="7" fill="#ffffff" stroke="#334155"
        stroke-width="1.5"/>
  <text x="356" y="468" font-size="13" font-weight="600" fill="#0f172a">Frozen sklearn pipeline</text>
  <text x="356" y="486" font-size="11" fill="#475569">
    TotalChargesCleaner · StandardScaler (3 numeric) + OneHotEncoder (16 categorical)
  </text>
  <text x="356" y="502" font-size="11" fill="#475569">
    → LogisticRegression over 46 transformed columns · fitted on the training pool only
  </text>

  <path d="M628 512 V526" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="448" y="530" width="360" height="56" rx="7" fill="#ffffff" stroke="#334155"
        stroke-width="1.5"/>
  <text x="464" y="552" font-size="13" font-weight="600" fill="#0f172a"
        font-family="ui-monospace, Consolas, monospace">churn_probability</text>
  <text x="464" y="571" font-size="10.5" fill="#475569">
    predict_proba, positive column resolved from classes_
  </text>

  <path d="M628 586 V604" fill="none" stroke="#475569" stroke-width="1.6"/>
  <path d="M628 604 H476 V616" fill="none" stroke="#475569" stroke-width="1.6"
        marker-end="url(#arrow)"/>
  <path d="M628 604 H780 V616" fill="none" stroke="#475569" stroke-width="1.6"
        marker-end="url(#arrow)"/>

  <rect x="340" y="620" width="272" height="110" rx="7" fill="#ffffff" stroke="#334155"
        stroke-width="1.5"/>
  <text x="356" y="642" font-size="13" font-weight="600" fill="#0f172a">Frozen decision policy</text>
  <text x="356" y="663" font-size="10.5" fill="#1e293b" font-family="ui-monospace, Consolas, monospace">
    positive = probability
  </text>
  <text x="356" y="678" font-size="10.5" fill="#1e293b" font-family="ui-monospace, Consolas, monospace">
    &gt;= 0.3272694566222328
  </text>
  <text x="356" y="698" font-size="10.5" fill="#475569">
    the comparison is &gt;=, not &gt;
  </text>
  <text x="356" y="714" font-size="10.5" fill="#475569">
    stored unrounded · calibration NONE
  </text>

  <rect x="644" y="620" width="272" height="110" rx="7" fill="#ffffff" stroke="#334155"
        stroke-width="1.5"/>
  <text x="660" y="642" font-size="13" font-weight="600" fill="#0f172a">Exact explanation</text>
  <text x="660" y="663" font-size="10.5" fill="#1e293b" font-family="ui-monospace, Consolas, monospace">
    logit = intercept
  </text>
  <text x="660" y="678" font-size="10.5" fill="#1e293b" font-family="ui-monospace, Consolas, monospace">
    + sum contribution(feature)
  </text>
  <text x="660" y="698" font-size="10.5" fill="#475569">
    an algebraic identity, not a sample
  </text>
  <text x="660" y="714" font-size="10.5" fill="#475569">
    withheld if it fails to reconstruct
  </text>

  <text x="340" y="758" font-size="11" fill="#475569">
    Both branches read the same canonical score. Nothing after the pipeline recomputes,
    rescales or recalibrates it.
  </text>

  <path d="M628 784 V808" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="340" y="812" width="576" height="62" rx="8" fill="#f8fafc" stroke="#64748b"
        stroke-width="1.5"/>
  <text x="356" y="834" font-size="13" font-weight="600" fill="#0f172a">API response</text>
  <text x="356" y="853" font-size="11" fill="#475569">
    churn_probability · prediction · decision · threshold · comparison · contributing factors
  </text>
  <text x="356" y="867" font-size="10.5" fill="#64748b">
    nothing is persisted: no request body, no score and no customer value is stored
  </text>

  <!-- === observability -->
  <text x="968" y="478" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.6">
    OBSERVABILITY
  </text>

  <path d="M940 558 H962" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"
        marker-end="url(#arrow-observe)"/>

  <rect x="968" y="488" width="224" height="164" rx="8" fill="#f8fafc" stroke="#94a3b8"
        stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="984" y="512" font-size="13" font-weight="600" fill="#0f172a">Monitoring observer</text>
  <text x="984" y="530" font-size="10.5" fill="#475569" font-family="ui-monospace, Consolas, monospace">
    GET /api/v1/monitoring
  </text>
  <text x="984" y="552" font-size="11" fill="#334155">observes every scored request</text>
  <text x="984" y="576" font-size="11" fill="#475569">PSI over numeric features</text>
  <text x="984" y="592" font-size="11" fill="#475569">TVD plus an unseen bucket</text>
  <text x="984" y="608" font-size="11" fill="#475569">score PSI · positive-rate shift</text>
  <text x="984" y="624" font-size="11" fill="#475569">7 structural equivalences</text>
  <text x="984" y="642" font-size="10.5" fill="#64748b">windows under 100 records: no verdict</text>

  <rect x="968" y="672" width="224" height="134" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="984" y="696" font-size="12.5" font-weight="700" fill="#0f172a">Not on the causal path</text>
  <text x="984" y="718" font-size="11" fill="#475569">It is handed the features and the</text>
  <text x="984" y="734" font-size="11" fill="#475569">score only after the answer already</text>
  <text x="984" y="750" font-size="11" fill="#475569">exists, and a failure inside it is</text>
  <text x="984" y="766" font-size="11" fill="#475569">counted, never raised.</text>
  <text x="984" y="788" font-size="11" fill="#475569">It never sees a label, so no</text>
  <text x="984" y="800" font-size="11" fill="#475569">performance metric is inferred.</text>

  <!-- === footer -->
  <line x1="48" y1="912" x2="1192" y2="912" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="936" font-size="11.5" fill="#475569">
    One process, in memory. There is no container orchestrator, no database, no queue and no
    feature store here — the diagram shows what exists,
  </text>
  <text x="48" y="954" font-size="11.5" fill="#475569">
    not a reference architecture. Monitoring state is per-process and is lost on restart, and the
    system has never served production traffic.
  </text>
  <text x="48" y="976" font-size="11" fill="#64748b">
    Solid arrows carry a scoring request. Neither dashed arrow scores anything: one hands the
    observer a copy of what was already decided, the other reads its aggregates back.
  </text>
</svg>
